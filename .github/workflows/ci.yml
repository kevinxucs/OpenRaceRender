name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Show Swift toolchain
        run: swift --version
      - name: Run unit tests
        run: |
          set -o pipefail
          if ./scripts/test.sh 2>&1 | tee "$RUNNER_TEMP/swift-test.log"; then
            exit 0
          fi
          python3 -c 'import pathlib,sys; text="\n".join(pathlib.Path(sys.argv[1]).read_text().splitlines()[-80:]); print("::error title=Swift test failure::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$RUNNER_TEMP/swift-test.log"
          exit 1
      - name: Build macOS application
        run: ./scripts/build.sh
      - name: Check command-line entry point
        run: .build/release/OpenRaceRender --help
